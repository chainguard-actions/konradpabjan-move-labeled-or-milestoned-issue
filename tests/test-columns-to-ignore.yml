name: Test columns-to-ignore input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under workflow_dispatch there is no issue payload, so after input
      # validation passes the action cannot read context.payload.issue and
      # exits non-zero. This exercises columns-to-ignore being accepted
      # alongside a valid label-name without breaking validation ordering.
      - id: action
        uses: .
        continue-on-error: true
        with:
          action-token: ${{ github.token }}
          project-url: https://github.com/orgs/example/projects/1
          column-name: To do
          label-name: bug
          columns-to-ignore: "Done,In progress"
      - name: Assert action ran and failed gracefully without issue payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no issue payload under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
