name: Test both label-name and milestone-name set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action-token: ${{ github.token }}
          project-url: https://github.com/orgs/example/projects/1
          column-name: To do
          label-name: bug
          milestone-name: v1.0
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both label-name and milestone-name are set"
            exit 1
          fi
          echo "PASS"
